services:
  minio:
    image: minio/minio:latest
    container_name: shop-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot job: create the bucket and make it public-read for image display.
  minio-init:
    image: minio/mc:latest
    container_name: shop-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/shop-images &&
      mc anonymous set download local/shop-images &&
      echo 'MinIO bucket shop-images ready (public-read).'
      "

volumes:
  minio-data:
